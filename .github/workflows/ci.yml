name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: Ci-Passw0rd!
        ports: ['1433:1433']
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Ci-Passw0rd!' -Q 'SELECT 1'"
          --health-interval=5s --health-timeout=5s --health-retries=30
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: medicenter
          POSTGRES_PASSWORD: medicenter
          POSTGRES_DB: medicenter
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U medicenter" --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      DB_USER: sa
      DB_PASSWORD: Ci-Passw0rd!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm ci --prefix server
      - run: npm run build
      - run: npm run db:init
      - run: npm test
      - name: Server fills an empty database on first start
        working-directory: server
        run: ../.github/scripts/first-start.sh
      # The same checks against PostgreSQL, the database used on Render
      - run: npm run db:init
        env: { DATABASE_URL: 'postgres://medicenter:medicenter@localhost:5432/medicenter' }
      - run: npm test
        env: { DATABASE_URL: 'postgres://medicenter:medicenter@localhost:5432/medicenter' }
      - name: Server fills an empty PostgreSQL database on first start
        working-directory: server
        run: ../.github/scripts/first-start.sh
        env: { DATABASE_URL: 'postgres://medicenter:medicenter@localhost:5432/medicenter' }
