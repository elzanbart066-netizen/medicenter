name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: Ci-Passw0rd!
        ports: ['1433:1433']
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Ci-Passw0rd!' -Q 'SELECT 1'"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      DB_USER: sa
      DB_PASSWORD: Ci-Passw0rd!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm ci --prefix server
      - run: npm run build
      - run: npm run db:init
      - run: npm test
      - name: Server fills an empty database on first start
        working-directory: server
        run: |
          node -e "import('./src/db.js').then(async (db) => { for (const t of ['reviews', 'appointments', 'services', 'doctor_branches', 'doctors', 'branches', 'users', 'organizations', 'specialties']) await db.query('DROP TABLE ' + t); await db.close() })"
          node src/index.js &
          for i in $(seq 1 30); do curl -sf localhost:3000/api/stats | grep -q '"clinics":6' && exit 0; sleep 2; done
          exit 1
